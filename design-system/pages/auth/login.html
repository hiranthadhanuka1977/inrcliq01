<!DOCTYPE html>
<html lang="en" data-feed-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — InrCliq</title>
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body>
    <div class="auth-path-shell">
      <section class="auth-split">
        <header class="auth-topbar">
          <div class="auth-topbar__actions">
            <div class="auth-topbar__prompt">
              <span class="auth-topbar__prompt-text">New here?</span>
              <a href="signup-step1.html" class="btn btn--outline-brand">Create a free account</a>
            </div>
            <button type="button" class="theme-switcher" aria-label="Switch to light theme" title="Light mode">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
              </svg>
            </button>
          </div>
        </header>

        <aside class="auth-split__marketing" aria-label="About InrCliq">
          <div class="auth-split__illustration" aria-hidden="true">
            <img src="../../assets/landing-illustration.svg" alt="" width="440" height="320" decoding="async" />
          </div>
          <h1 class="auth-split__headline">Unlock Exclusive Content from Top Creators</h1>
          <p class="auth-split__tagline">
            Discover premium videos, live sessions, and more from top creators in fitness, cooking, music, and beyond.
          </p>
        </aside>

        <div class="auth-split__auth">
          <div class="auth-split__auth-inner">
            <a href="login.html" class="logo logo--img">
              <img src="../../assets/logo-InrCliq.svg" alt="InrCliq" class="logo__img" width="114" height="27" />
            </a>
            <h2>Welcome back.</h2>
            <p class="subtitle mt-2">Log in to your InrCliq account.</p>

            <div class="gap-3 mt-8">
              <button type="button" class="btn btn--secondary btn-login-oauth" disabled>
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Continue with Google
              </button>
              <button type="button" class="btn btn--dark btn-login-oauth" disabled>
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                </svg>
                Continue with Apple
              </button>
              <div class="divider">or</div>

              <div id="login-email-step" class="gap-3">
                <form class="gap-3" action="#">
                  <div class="field">
                    <label class="field-label" for="login-email">Email</label>
                    <input class="input" type="email" id="login-email" value="alex@example.com" placeholder="you@example.com" autocomplete="email" />
                  </div>
                  <button type="submit" class="btn btn--primary">
                    <span class="btn__label">Send login code</span>
                  </button>
                  <p class="auth-forgot-link">
                    <a href="forgot-login.html" class="link-btn" id="link-forgot-login-details">Forgot login details?</a>
                  </p>
                  <p class="login-method-switch">
                    <button type="button" class="link-btn login-method-switch__link" id="link-use-password-login" onclick="window.location.href='login-password.html'">
                      <svg class="login-method-switch__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                      </svg>
                      Use password to login
                    </button>
                  </p>
                </form>
              </div>
            </div>
          </div>
        </div>

        <p class="auth-split__copyright">&copy; 2026 InrCliq. All rights reserved.</p>
      </section>
    </div>
    <script src="../../js/onboarding.js"></script>
  </body>
</html>
