<!DOCTYPE html>
<html lang="en" data-feed-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent approved — InrCliq Onboarding</title>
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body>
    <div class="auth-path-shell auth-path-shell--top-logo">
      <a href="../../index.html" class="auth-top-logo logo logo--img" aria-label="InrCliq home">
        <img src="../../assets/logo-InrCliq.svg" alt="InrCliq" class="logo__img" width="114" height="27" />
      </a>

      <button type="button" class="theme-switcher theme-switcher--auth-fixed" aria-label="Switch to light theme" title="Light mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </button>

      <section id="screen-ONB-05" class="auth-center auth-center--signup-step">
        <div class="auth-center__card auth-center__card--step-offset">
          <div class="text-center">
            <div class="toast-card__icon toast-card__icon--centered">✓</div>
            <h1>Your parent approved!</h1>
            <p class="subtitle mt-4">
              Welcome to InrCliq, Alex. Your parent or guardian approved your request. You can progress to the next step
              and complete your profile.
            </p>
            <button type="button" class="btn btn--primary mt-8">Continue</button>
          </div>
        </div>
      </section>

      <div class="signup-progress is-visible" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" aria-label="Signup progress">
        <div class="signup-progress__track">
          <div class="signup-progress__bar" style="width: 62%"></div>
        </div>
      </div>
    </div>
    <script src="../../js/onboarding.js"></script>
  </body>
</html>
